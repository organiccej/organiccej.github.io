<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="canonical" href="https://organiccej.github.io/bollard-archive.html" />
  <style>
    :root { --primary:#1d4ed8; --navy:#0f172a; --red:#e11d48; --teal:#0d9488; --bg:#f8fafc; --white:#ffffff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); line-height:1.65; word-break:keep-all; }
    a { color:inherit; text-decoration:none; }
    .container { max-width:1060px; margin:0 auto; padding:0 18px; }
    .header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
    .header-inner { display:flex; align-items:center; justify-content:space-between; padding:13px 18px; gap:10px; flex-wrap:wrap; }
    .logo { font-size:1.18rem; font-weight:900; color:var(--navy); }
    .logo span { color:var(--red); }
    .nav-btns { display:flex; gap:8px; align-items:center; }
    .pill-btn { background:#f1f5f9; border:1px solid #cbd5e1; padding:6px 12px; border-radius:999px; font-size:0.82rem; font-weight:700; }
    .call-btn { background:var(--navy); color:#fff; padding:7px 14px; border-radius:8px; font-size:0.84rem; font-weight:800; }
    .hero { background:var(--white); border-bottom:1px solid var(--border); padding:34px 0 30px; text-align:center; }
    .hero-tag { display:inline-block; font-size:0.78rem; font-weight:800; color:var(--red); background:#fff1f2; border:1px solid #fecdd3; padding:4px 12px; border-radius:999px; margin-bottom:10px; }
    h1 { font-size:clamp(1.4rem,3vw,2rem); font-weight:900; color:var(--navy); margin:0 0 8px; letter-spacing:-0.025em; }
    .hero p { font-size:0.94rem; color:var(--muted); margin:0 auto; max-width:650px; }
    .sec { padding:34px 0 54px; }
    .filter-bar { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:26px; }
    .filter-btn { background:#fff; border:1px solid #cbd5e1; color:#334155; padding:8px 15px; border-radius:999px; font-size:0.86rem; font-weight:800; cursor:pointer; }
    .filter-btn.active, .filter-btn:hover { background:var(--navy); color:#fff; border-color:var(--navy); }
    .case-list { display:flex; flex-direction:column; gap:24px; }
    .case-item { background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px 20px; box-shadow:0 4px 14px rgba(15,23,42,0.04); }
    .case-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
    .badge-loc { background:var(--red); color:#fff; font-size:0.78rem; font-weight:800; padding:4px 10px; border-radius:6px; }
    .badge-kw { background:#eff6ff; color:var(--primary); font-size:0.78rem; font-weight:800; padding:4px 10px; border-radius:6px; }
    .case-item h2 { font-size:1.18rem; font-weight:900; color:var(--navy); margin:0 0 8px; line-height:1.4; }
    .case-item p { font-size:0.92rem; color:#475569; margin:0 0 16px; line-height:1.68; }
    .ba-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
    @media (max-width:680px) { .ba-grid { grid-template-columns:1fr; } }
    .ba-fig { margin:0; position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:#0f172a; }
    .ba-fig img { width:100%; height:240px; object-fit:cover; display:block; }
    .ba-tag { position:absolute; top:10px; left:10px; padding:4px 11px; border-radius:6px; font-size:0.76rem; font-weight:800; color:#fff; background:#dc2626; }
    .ba-tag.after { background:var(--primary); }
    .ba-fig figcaption { background:#f8fafc; padding:8px 12px; font-size:0.82rem; font-weight:700; color:#334155; text-align:center; }
    .case-foot { margin-top:16px; padding-top:14px; border-top:1px dashed var(--border); display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; }
    .cta-sm { background:var(--red); color:#fff; padding:9px 16px; border-radius:9px; font-size:0.86rem; font-weight:800; }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">마이홈리페어랩 <span>· 지역별 볼라드 시공 기록</span></a>
      <div class="nav-btns">
        <a class="pill-btn" href="index.html">← 볼라드 메인</a>
        <a class="pill-btn" href="index.html#quick-quote">견적 바로가기</a>
        <a class="call-btn" href="tel:010-7724-5425">📞 010-7724-5425</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <span class="hero-tag">BOLLARD &amp; PARKING BAR ARCHIVE</span>
      <h1>지역별 주차 볼라드 · 주차 안전바 수리 교체 업체 시공 사례</h1>
      <p>서울 · 경기도 · 인천 · 충주 실제 현장에서 파손된 주차 볼라드·안전바 1개만 정밀 부분 교체·재고정한 전후 기록입니다.</p>
    </div>
  </section>

  <main class="sec">
    <div class="container">
      <div class="filter-bar" id="bollard-filters">
        <button type="button" class="filter-btn active" data-area="all">전체 지역 (2)</button>
        <button type="button" class="filter-btn" data-area="gyeonggi">경기도 (남양주 와부읍)</button>
        <button type="button" class="filter-btn" data-area="seoul">서울특별시 (송파구 문정동)</button>
      </div>

      <div class="case-list" id="bollard-case-list"></div>
    </div>
  </main>

  <footer style="background:#fff; border-top:1px solid var(--border); padding:24px 18px; text-align:center; font-size:0.86rem; color:var(--muted);">
    <p style="margin:0 0 6px;"><strong>마이홈리페어랩</strong> | 대표 상담: <a href="tel:010-7724-5425" style="color:var(--primary); font-weight:700;">010-7724-5425</a></p>
    <p style="margin:0;">남양주 와부읍 · 송파구 문정동 · 구리 · 광명 · 서울·경기·인천·충주 주차 볼라드·안전바 수리 교체 업체</p>
  </footer>

  <script>
    // 앞으로 새로운 지역(시/구/동) 볼라드 시공 사례가 생길 때마다 맨 위에 1블록씩 추가하세요!
    const BOLLARD_CASES = [
      {
        area: "seoul",
        regionLabel: "서울 송파구 문정동",
        keywordBadge: "송파구 문정동 주차 볼라드 · 주차금지봉 수리 교체 업체",
        title: "송파구 문정동 주차 볼라드(주차금지봉) 파손 부위 1개 부분 교체 및 앙카 재고정 수리",
        desc: "서울 송파구 문정동 상가·오피스 주차 진출입로에서 차량 접촉으로 기울어지고 파손된 기존 주차 볼라드(주차금지봉)를 전체 철거 없이 1개만 정밀 철거했습니다. 바닥 강도에 맞춰 잔여 앙카를 정리한 뒤 신품 볼라드로 수평·간격을 맞춰 견고하게 교체 시공했습니다.",
        beforeImg: "assets/songpa_munjeong_before.jpg",
        beforeAlt: "송파구 문정동 주차 볼라드 주차금지봉 파손 수리 교체 시공 전",
        afterImg: "assets/songpa_munjeong_after.jpg",
        afterAlt: "송파구 문정동 주차 볼라드 주차금지봉 신품 부분 교체 완료 후",
        quoteRegion: "송파구 문정동"
      },
      {
        area: "gyeonggi",
        regionLabel: "경기 남양주 와부읍",
        keywordBadge: "남양주 와부읍 주차 볼라드 · 주차 안전바 수리 교체 업체",
        title: "남양주 와부읍 주차 볼라드 및 주차 안전바 파손 1개 부분 교체·바닥 보강 수리",
        desc: "경기도 남양주시 와부읍(덕소 일대) 주차 구역에서 외부 충격으로 이탈·파손된 주차 볼라드(주차 안전바)를 부분 보수했습니다. 주변 멀쩡한 시설물은 보존하고 파손된 위치만 전용 앙카 공법으로 흔들림 없이 교체·재고정해 차량 통제 기능을 복구했습니다.",
        beforeImg: "assets/namyangju_wabu_before.jpg",
        beforeAlt: "남양주 와부읍 주차 볼라드 주차 안전바 파손 수리 교체 시공 전",
        afterImg: "assets/namyangju_wabu_after.jpg",
        afterAlt: "남양주 와부읍 주차 볼라드 주차 안전바 신품 교체 완료 후",
        quoteRegion: "남양주 와부읍"
      }
    ];

    const listEl = document.getElementById('bollard-case-list');
    function renderCases(filterArea) {
      const items = filterArea === 'all' ? BOLLARD_CASES : BOLLARD_CASES.filter(item => item.area === filterArea);
      listEl.innerHTML = items.map(item => `
        <article class="case-item">
          <div class="case-meta">
            <span class="badge-loc">📍 ${item.regionLabel}</span>
            <span class="badge-kw">${item.keywordBadge}</span>
          </div>
          <h2>${item.title}</h2>
          <p>${item.desc}</p>
          <div class="ba-grid">
            <figure class="ba-fig">
              <img src="${item.beforeImg}" alt="${item.beforeAlt}" loading="lazy" />
              <span class="ba-tag">시공 전 · 파손/이탈</span>
              <figcaption>${item.regionLabel} 시공 전 상태</figcaption>
            </figure>
            <figure class="ba-fig">
              <img src="${item.afterImg}" alt="${item.afterAlt}" loading="lazy" />
              <span class="ba-tag after">시공 후 · 정밀 교체 완료</span>
              <figcaption>${item.regionLabel} 부분 교체·앙카 고정 완료</figcaption>
            </figure>
          </div>
          <div class="case-foot">
            <span style="font-size:0.85rem; color:#64748b;">✔ 1개 소량 부분 교체 · 아스콘/콘크리트/블록 맞춤 시공</span>
            <a class="cta-sm" href="index.html?region=${encodeURIComponent(item.quoteRegion)}#quick-quote">📋 ${item.regionLabel} 볼라드 견적 바로가기 →</a>
          </div>
        </article>
      `).join('');
    }
    renderCases('all');

    document.querySelectorAll('#bollard-filters .filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#bollard-filters .filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderCases(this.getAttribute('data-area'));
      });
    });
  </script>
</body>
</html>
